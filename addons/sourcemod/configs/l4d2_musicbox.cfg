// Music box list. This file is read at map start; edit it and restart/change
// the map to choose a new random box and rebuild the download table.
//
// Playback value: musicbox/example/MVP.mp3 or custom/example.mp3
// Download value generated by the plugin: sound/musicbox/example/MVP.mp3
// Do not write sound/ in the values below; the plugin adds it for FastDL.
//
// If a track value is empty and base is present, the plugin derives:
//   base_MVP.mp3, base_round_win.mp3, base_round_lose.mp3

"MusicBoxes"
{
	"inhuman"
	{
		"name"       "Inhuman"
		"mvp"        "musicbox/inhuman/MVP.mp3"
		"round_win"  "musicbox/inhuman/round_win.mp3"
		"round_lose" "musicbox/inhuman/round_lose.mp3"
	}

	// Copy this block to add another music box; nothing is hard-coded in the
	// plugin. Explicit track paths override the derived base paths.
	// "another_box"
	// {
	//     "name"       "Another Box"
	//     "base"       "custom/another_box"
	//     "mvp"        ""
	//     "round_win"  ""
	//     "round_lose" ""
	// }
}
